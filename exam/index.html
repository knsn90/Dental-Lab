<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sınav Sistemi</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1c2433;
    --muted: #6b7280;
    --line: #e5e8f0;
    --brand: #3b5bdb;
    --brand-soft: #eef2ff;
    --ok: #2f9e44;
    --ok-soft: #ebfbee;
    --bad: #e03131;
    --bad-soft: #fff5f5;
    --shadow: 0 10px 30px rgba(28,36,51,.08);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .topbar h1 { font-size: 20px; margin: 0; letter-spacing: -.2px; }
  .topbar .home-btn {
    background: none; border: 1px solid var(--line); color: var(--muted);
    padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .topbar .home-btn:hover { color: var(--ink); border-color: #cfd4e3; }

  .card {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 24px; border: 1px solid var(--line);
  }

  /* exam list */
  .exam-item {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--card); margin-bottom: 14px; cursor: pointer; transition: .15s;
  }
  .exam-item:hover { border-color: var(--brand); box-shadow: var(--shadow); transform: translateY(-1px); }
  .exam-item .meta h3 { margin: 0 0 4px; font-size: 17px; }
  .exam-item .meta p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .exam-item .count {
    flex: none; background: var(--brand-soft); color: var(--brand);
    font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;
  }
  .section-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 0 0 14px; }

  /* progress */
  .progress-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .progress-head .step { font-size: 13px; font-weight: 700; color: var(--muted); }
  .bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 26px; }
  .bar > span { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width .3s ease; }

  .q-type { font-size: 12px; font-weight: 700; color: var(--brand); background: var(--brand-soft); display: inline-block; padding: 4px 10px; border-radius: 999px; margin-bottom: 14px; }
  .q-text { font-size: 21px; font-weight: 650; letter-spacing: -.3px; margin: 0 0 22px; }

  /* options */
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%;
    text-align: left; padding: 15px 18px; margin-bottom: 12px;
    border: 1.5px solid var(--line); border-radius: 14px; background: #fff;
    font-size: 16px; cursor: pointer; transition: .12s; color: var(--ink);
  }
  .opt:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-soft); }
  .opt .key {
    flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--brand-soft); color: var(--brand);
    display: grid; place-items: center; font-weight: 700; font-size: 14px;
  }
  .opt.selected { border-color: var(--brand); background: var(--brand-soft); }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.correct .key { background: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.wrong .key { background: var(--bad); color: #fff; }
  .opt:disabled { cursor: default; }

  /* open input */
  .open-input {
    width: 100%; padding: 15px 18px; font-size: 16px; border: 1.5px solid var(--line);
    border-radius: 14px; outline: none; font-family: inherit; color: var(--ink);
  }
  .open-input:focus { border-color: var(--brand); }
  .open-input:disabled { background: #f7f8fc; }

  /* feedback */
  .feedback { margin-top: 18px; padding: 16px 18px; border-radius: 14px; font-size: 15px; }
  .feedback.ok { background: var(--ok-soft); border: 1px solid #c3e6cb; color: #1b6e2c; }
  .feedback.bad { background: var(--bad-soft); border: 1px solid #f1c2c2; color: #a51d1d; }
  .feedback.info { background: var(--brand-soft); border: 1px solid #cdd6ff; color: #2c3b8f; }
  .feedback.info + .feedback { margin-top: 10px; }
  .feedback b { display: block; margin-bottom: 4px; font-size: 15px; }
  .feedback .correct-answer { font-weight: 700; }
  .feedback .explain { margin-top: 8px; color: var(--ink); opacity: .8; font-size: 14px; }

  /* buttons */
  .actions { margin-top: 24px; display: flex; gap: 12px; }
  .btn {
    flex: 1; padding: 15px; border-radius: 14px; border: none; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: .12s; font-family: inherit;
  }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:hover { background: #2f4ec0; }
  .btn.primary:disabled { background: #b9c2e8; cursor: not-allowed; }
  .btn.ghost { background: #fff; border: 1.5px solid var(--line); color: var(--ink); flex: none; padding-left: 26px; padding-right: 26px; }
  .btn.ghost:hover { border-color: #cfd4e3; }

  /* result */
  .result { text-align: center; }
  .score-ring {
    width: 150px; height: 150px; border-radius: 50%; margin: 8px auto 20px;
    display: grid; place-items: center; background: conic-gradient(var(--brand) var(--pct), var(--line) 0);
  }
  .score-ring .inner {
    width: 120px; height: 120px; border-radius: 50%; background: #fff; display: grid; place-items: center;
  }
  .score-ring .num { font-size: 34px; font-weight: 800; line-height: 1; }
  .score-ring .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .result h2 { margin: 4px 0 6px; font-size: 24px; }
  .result .sub { color: var(--muted); margin: 0 0 22px; }
  .review { text-align: left; margin-top: 8px; }
  .review-item { padding: 14px 0; border-top: 1px solid var(--line); display: flex; gap: 12px; }
  .review-item .ic { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 800; color: #fff; }
  .review-item .ic.ok { background: var(--ok); }
  .review-item .ic.bad { background: var(--bad); }
  .review-item .rq { font-size: 14px; }
  .review-item .ra { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>📋 Sınav Sistemi</h1>
    <button class="home-btn" id="homeBtn" style="display:none" onclick="goHome()">← Sınav listesi</button>
  </div>
  <div id="root"></div>
</div>

<script src="exams.js"></script>
<script>
const root = document.getElementById("root");
const homeBtn = document.getElementById("homeBtn");
const KEYS = ["A", "B", "C", "D", "E", "F"];

let state = null; // { exam, i, answers: [], revealed: bool }

function goHome() {
  state = null;
  homeBtn.style.display = "none";
  renderHome();
}

/* ---------- HOME / EXAM SELECTOR ---------- */
function renderHome() {
  const exams = window.EXAMS || [];
  if (!exams.length) {
    root.innerHTML = `<div class="card empty">Henüz sınav eklenmemiş.<br>PDF'ler <code>exams.js</code> dosyasına eklenecek.</div>`;
    return;
  }
  let html = `<p class="section-label">Sınav seç</p>`;
  exams.forEach((ex, idx) => {
    html += `
      <div class="exam-item" onclick="startExam(${idx})">
        <div class="meta">
          <h3>${esc(ex.title)}</h3>
          <p>${esc(ex.description || "")}</p>
        </div>
        <div class="count">${ex.questions.length} soru</div>
      </div>`;
  });
  root.innerHTML = html;
}

/* ---------- START EXAM ---------- */
function startExam(idx) {
  const exam = window.EXAMS[idx];
  state = {
    exam,
    i: 0,
    answers: new Array(exam.questions.length).fill(null), // {given, correct:bool}
    revealed: false,
    pending: null, // current user input before checking
  };
  homeBtn.style.display = "inline-block";
  renderQuestion();
}

/* ---------- QUESTION ---------- */
function renderQuestion() {
  const { exam, i } = state;
  const q = exam.questions[i];
  const total = exam.questions.length;
  const answered = state.answers[i];
  const pct = Math.round(((i) / total) * 100);

  let body = `
    <div class="progress-head">
      <span class="step">${esc(exam.title)}</span>
      <span class="step">Soru ${i + 1} / ${total}</span>
    </div>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <div class="card">
      <span class="q-type">${q.type === "mc" ? "Çoktan seçmeli" : q.type === "self" ? "Açık uçlu (kendin değerlendir)" : "Yazılı cevap"}</span>
      <p class="q-text">${esc(q.question)}</p>`;

  if (q.type === "mc") {
    body += `<div id="opts">`;
    q.options.forEach((opt, oi) => {
      let cls = "opt";
      if (state.revealed) {
        if (isCorrectMc(q, oi)) cls += " correct";
        else if (answered && answered.givenIndex === oi) cls += " wrong";
      } else if (state.pending === oi) {
        cls += " selected";
      }
      body += `
        <button class="${cls}" ${state.revealed ? "disabled" : ""} onclick="selectMc(${oi})">
          <span class="key">${KEYS[oi]}</span><span>${esc(opt)}</span>
        </button>`;
    });
    body += `</div>`;
  } else if (q.type === "self") {
    const val = state.revealed ? (answered ? esc(answered.given) : esc(state.pending || "")) : esc(state.pending || "");
    body += `<textarea class="open-input" id="openArea" rows="4" placeholder="Cevabını yaz... (kendin değerlendireceksin)"
              ${state.revealed ? "disabled" : ""}
              oninput="state.pending=this.value">${val}</textarea>`;
  } else {
    const val = state.revealed ? (answered ? esc(answered.given) : "") : (state.pending || "");
    body += `<input class="open-input" id="openInput" placeholder="Cevabını yaz..." value="${esc(val)}"
              ${state.revealed ? "disabled" : ""}
              oninput="state.pending=this.value"
              onkeydown="if(event.key==='Enter'&&!state.revealed)checkAnswer()">`;
  }

  // feedback after reveal
  if (state.revealed) {
    if (q.type === "self") {
      body += `<div class="feedback info"><b>📘 Örnek cevap</b><div class="explain">${esc(q.answer)}</div></div>`;
      if (answered) {
        body += answered.correct
          ? `<div class="feedback ok"><b>✓ Doğru bildim olarak işaretledin</b></div>`
          : `<div class="feedback bad"><b>✗ Bilemedim olarak işaretledin</b></div>`;
      }
    } else if (answered) {
      if (answered.correct) {
        body += `<div class="feedback ok"><b>✓ Doğru!</b>${q.explanation ? `<div class="explain">${esc(q.explanation)}</div>` : ""}</div>`;
      } else {
        body += `<div class="feedback bad">
          <b>✗ Yanlış</b>
          Doğru cevap: <span class="correct-answer">${esc(correctText(q))}</span>
          ${q.explanation ? `<div class="explain">${esc(q.explanation)}</div>` : ""}
        </div>`;
      }
    }
  }

  // actions
  body += `<div class="actions">`;
  if (!state.revealed) {
    if (q.type === "self") {
      body += `<button class="btn primary" onclick="revealSelf()">Cevabı Göster</button>`;
    } else {
      body += `<button class="btn primary" id="checkBtn" onclick="checkAnswer()">Kontrol Et</button>`;
    }
  } else if (q.type === "self" && !answered) {
    body += `<button class="btn ghost" onclick="gradeSelf(false)">✗ Bilemedim</button>
             <button class="btn primary" onclick="gradeSelf(true)">✓ Doğru bildim</button>`;
  } else {
    const last = i === total - 1;
    body += `<button class="btn primary" onclick="next()">${last ? "Sınavı Bitir →" : "İleri →"}</button>`;
  }
  body += `</div></div>`;

  root.innerHTML = body;
}

function selectMc(oi) {
  if (state.revealed) return;
  state.pending = oi;
  renderQuestion();
}

function isCorrectMc(q, oi) {
  if (typeof q.answer === "number") return q.answer === oi;
  return norm(q.options[oi]) === norm(q.answer);
}

function correctText(q) {
  if (q.type === "mc") {
    if (typeof q.answer === "number") return q.options[q.answer];
    return q.answer;
  }
  return q.answer;
}

function checkAnswer() {
  const { exam, i } = state;
  const q = exam.questions[i];
  let correct = false;
  let given = "";
  let givenIndex = null;

  if (q.type === "mc") {
    if (state.pending === null || state.pending === undefined) return; // hiçbir şık seçilmedi
    givenIndex = state.pending;
    given = q.options[givenIndex];
    correct = isCorrectMc(q, givenIndex);
  } else {
    given = (state.pending || "").trim();
    if (!given) return; // boş cevap
    const accepts = [q.answer, ...(q.accept || [])].map(norm);
    correct = accepts.includes(norm(given));
  }

  state.answers[i] = { given, givenIndex, correct };
  state.revealed = true;
  renderQuestion();
}

function revealSelf() {
  state.revealed = true;
  renderQuestion();
}

function gradeSelf(ok) {
  const given = (state.pending || "").trim();
  state.answers[state.i] = { given, givenIndex: null, correct: ok };
  renderQuestion();
}

function next() {
  if (state.i === state.exam.questions.length - 1) {
    renderResult();
    return;
  }
  state.i++;
  state.revealed = false;
  state.pending = null;
  renderQuestion();
}

/* ---------- RESULT ---------- */
function renderResult() {
  const { exam, answers } = state;
  const total = exam.questions.length;
  const correct = answers.filter(a => a && a.correct).length;
  const pct = Math.round((correct / total) * 100);
  const deg = pct * 3.6;

  let msg, sub;
  if (pct === 100) { msg = "Mükemmel! 🎉"; sub = "Tüm soruları doğru yaptın."; }
  else if (pct >= 70) { msg = "Tebrikler! 👏"; sub = "İyi bir sonuç."; }
  else if (pct >= 50) { msg = "Fena değil 🙂"; sub = "Biraz daha çalışmaya devam."; }
  else { msg = "Daha çok çalışmalı 💪"; sub = "Tekrar denemekten çekinme."; }

  let html = `
    <div class="card result">
      <div class="score-ring" style="--pct:${deg}deg">
        <div class="inner">
          <div>
            <div class="num">${pct}%</div>
            <div class="lbl">${correct} / ${total} doğru</div>
          </div>
        </div>
      </div>
      <h2>${msg}</h2>
      <p class="sub">${esc(sub)}</p>

      <div class="review">`;

  exam.questions.forEach((q, qi) => {
    const a = answers[qi];
    const ok = a && a.correct;
    html += `
      <div class="review-item">
        <span class="ic ${ok ? "ok" : "bad"}">${ok ? "✓" : "✗"}</span>
        <div>
          <div class="rq">${qi + 1}. ${esc(q.question)}</div>
          ${ok ? "" : `<div class="ra">Senin cevabın: ${esc(a ? a.given : "—")} · Doğru: ${esc(correctText(q))}</div>`}
        </div>
      </div>`;
  });

  html += `
      </div>
      <div class="actions">
        <button class="btn ghost" onclick="goHome()">Sınav listesi</button>
        <button class="btn primary" onclick="startExam(${window.EXAMS.indexOf(exam)})">Tekrar dene</button>
      </div>
    </div>`;

  root.innerHTML = html;
}

/* ---------- utils ---------- */
function norm(s) {
  return String(s).toLocaleLowerCase("tr").trim()
    .replace(/[–—]/g, "-")          // en/em dash -> hyphen
    .replace(/\s+/g, " ")
    .replace(/\s*-\s*/g, "-")        // "1 - 3" -> "1-3"
    .replace(/[.,;:!?]+$/g, "");
}
function esc(s) {
  return String(s == null ? "" : s)
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

renderHome();
</script>
</body>
</html>
