<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F3F5;
    --navy-deep:#28316f;
    --navy-light:#548dca;
    --navy-flat:#004B87;
    --wave-deep:#1c2450;
    --ink:#10131f;
    --panel-w:1290px;
    --panel-h:2796px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#5b5f66;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  /* ---------- strip ---------- */
  #strip{display:flex;gap:0;width:max-content;transform-origin:0 0}
  body.preview #strip{transform:scale(var(--s,0.147))}
  body.preview{padding:24px}
  body.export{background:#fff;padding:0}

  .panel{
    position:relative;width:var(--panel-w);height:var(--panel-h);
    overflow:hidden;background:var(--paper);flex:0 0 auto;
  }
  body.preview .panel{outline:1px solid rgba(255,255,255,.25);outline-offset:-1px}

  /* ---------- continuous wave ---------- */
  .wave{position:absolute;top:0;left:0;height:var(--panel-h);pointer-events:none}

  /* ---------- headline ---------- */
  .copy{position:absolute;left:96px;right:96px;z-index:3}
  .copy.top{top:196px}
  .copy.bottom{bottom:210px}
  .copy h2{
    font-family:Montserrat,sans-serif;font-weight:900;font-size:128px;line-height:1.08;
    letter-spacing:-3px;color:var(--ink);text-transform:uppercase;
  }
  .copy.bottom h2{color:#fff}
  .copy h2 .hi{color:var(--navy-light)}
  /* Farsça: Montserrat'ta Fars glifleri yok; Vazirmatn + RTL + normal harf aralığı */
  body[data-rtl="1"] .copy{direction:rtl}
  body[data-rtl="1"] .copy h2{font-family:Vazirmatn,sans-serif;font-weight:900;
    letter-spacing:0;line-height:1.45;font-size:112px;text-transform:none}
  .copy.bottom h2 .hi{color:#9fd0ff}

  /* ---------- phone ---------- */
  .stage{position:absolute;left:0;right:0;display:flex;justify-content:center;z-index:2}
  .stage.lower{top:868px}
  .stage.upper{top:252px}
  .phone{
    width:800px;height:1734px;border-radius:92px;flex:0 0 auto;
    background:linear-gradient(145deg,#6f6a7d,#3c3947 40%,#5d5869);
    padding:14px;transform:rotate(var(--rot,0deg));
    box-shadow:0 70px 120px -30px rgba(16,19,31,.55), 0 10px 30px rgba(16,19,31,.25);
  }
  .screen{
    width:100%;height:100%;border-radius:80px;background:#fff;overflow:hidden;
    position:relative;display:flex;flex-direction:column;
  }
  .island{position:absolute;top:26px;left:50%;transform:translateX(-50%);
    width:230px;height:62px;border-radius:40px;background:#16151b;z-index:9}
  .sbar{height:112px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 56px 14px;font-size:27px;font-weight:600;color:#10131f}
  .sbar .dots{display:flex;gap:7px;align-items:center}
  .sbar i{display:block;width:8px;height:8px;border-radius:50%;background:#10131f;font-style:normal}
  .sbar b{display:block;width:44px;height:20px;border-radius:5px;border:2.5px solid #10131f;position:relative}
  .sbar b::after{content:"";position:absolute;inset:3px;background:#10131f;border-radius:2px}

  .body{flex:1;padding:14px 40px 40px;display:flex;flex-direction:column;gap:22px;overflow:hidden}
  /* Telefon ekranı bir liste; çocuklar sıkışıp üst üste binmemeli */
  .body>*{flex-shrink:0}
  .body>.sp{flex:1 1 auto;min-height:16px}

  /* generic screen atoms */
  .h1{font-size:46px;font-weight:700;color:#10131f;letter-spacing:-1px}
  .h2s{font-size:31px;font-weight:600;color:#10131f}
  .mut{font-size:26px;color:#8b93a3}
  .card{background:#fff;border:2px solid #eceef3;border-radius:34px;padding:30px;box-shadow:0 8px 26px rgba(16,19,31,.05)}
  .row{display:flex;align-items:center;gap:22px}
  .pill{border-radius:999px;padding:13px 28px;font-size:25px;font-weight:600}
  .cta{background:var(--navy-flat);color:#fff;border-radius:28px;padding:30px;text-align:center;
    font-size:33px;font-weight:700}
  .bar{height:18px;border-radius:9px;background:#eceef3}
  .av{width:74px;height:74px;border-radius:50%;background:linear-gradient(140deg,var(--navy-light),var(--navy-deep));flex:0 0 auto}
  .sq{width:74px;height:74px;border-radius:22px;background:#eef2f8;flex:0 0 auto}
  .tabbar{height:118px;border-top:2px solid #eceef3;display:flex;align-items:center;justify-content:space-around;padding:0 30px}
  .tabbar span{width:56px;height:56px;border-radius:18px;background:#eceef3}
  .tabbar span.on{background:var(--navy-flat)}

  /* Gerçek uygulama ekran görüntüsü — durum çubuğunun altına oturur.
     Yüklenemezse kendini siler, altındaki CSS yer tutucu görünür. */
  .shot{position:absolute;left:0;top:112px;width:100%;height:calc(100% - 112px);
    object-fit:cover;object-position:top center;display:block}
</style>

const PANEL_W = 1290, PANEL_H = 2796, COUNT = 10;
const STRIP_W = PANEL_W * COUNT;

/* ---- continuous wave across the whole strip ---- */
function wavePath(baseY, a1, p1, a2, p2, phase){
  const step = 18;
  let d = "M 0 " + (baseY + a1*Math.sin(phase) + a2*Math.sin(phase*1.7));
  for (let x = step; x <= STRIP_W; x += step){
    const y = baseY
      + a1*Math.sin((x/p1)*Math.PI*2 + phase)
      + a2*Math.sin((x/p2)*Math.PI*2 + phase*1.7);
    d += " L " + x + " " + y.toFixed(1);
  }
  return d + " L " + STRIP_W + " " + PANEL_H + " L 0 " + PANEL_H + " Z";
}

        <div style="width:72px;height:72px;border-radius:50%;background:#075e54"></div></div></div>`,

  multilab: `<div class="body">

      ${[['Nexadent Dental Lab','İstanbul','#004B87',true],
         ['Siman Prodental','Ankara','#548dca',false],
         ['Ege Dental Studio','İzmir','#28316f',false]]
        .map(([n,c,col,on])=>`<div class="card" style="padding:30px;${on?'border-color:#004B87;border-width:3px':''}">

/* ---- build ---- */
const LANG = new URLSearchParams(location.search).get('lang') || 'tr';
fetch(`copy.${LANG}.json`).then(r=>r.json()).then(cfg=>{
  if (cfg.rtl) document.body.dataset.rtl = '1';
  const strip = document.getElementById('strip');
  cfg.panels.forEach((p,i)=>{
    const head = [
      p.lead ? `<span>${p.lead}</span> ` : '',
      p.hi   ? `<span class="hi">${p.hi}</span> ` : '',
      p.tail ? `<span>${p.tail}</span>` : ''
    ].join('');

    strip.insertAdjacentHTML('beforeend', `
      <section class="panel" data-i="${i}">
        <svg class="wave" width="${STRIP_W}" height="${PANEL_H}"
             viewBox="0 0 ${STRIP_W} ${PANEL_H}" style="left:${-i*PANEL_W}px">
          <defs>
            <linearGradient id="g${i}" x1="0" y1="0" x2="${STRIP_W}" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#28316f"/><stop offset="1" stop-color="#548dca"/>
            </linearGradient>
          </defs>
          <path d="${MAIN_WAVE}" fill="url(#g${i})"/>
          <path d="${DEEP_WAVE}" fill="#1c2450" opacity=".55"/>
        </svg>

        <div class="copy ${p.pos}"><h2>${head}</h2></div>

        <div class="stage ${p.pos === 'top' ? 'lower' : 'upper'}">
          <div class="phone" style="--rot:${p.tilt}deg">
            <div class="screen">
              <div class="island"></div>
              <div class="sbar"><span>9:41</span>
                <span class="dots"><i></i><i></i><i></i><b></b></span></div>
              ${S[p.screen] || '<div class="body"></div>'}
              <img class="shot" src="shots/${LANG}/${String(i+1).padStart(2,'0')}.png"
                   alt="" onerror="this.remove()">
            </div>
          </div>
        </div>
      </section>`);
  });

  if (new URLSearchParams(location.search).has('export')){
    document.body.className = 'export';
  } else {
    const fit = (window.innerWidth - 48) / STRIP_W;
    document.documentElement.style.setProperty('--s', fit);
    document.body.style.height = (PANEL_H * fit + 48) + 'px';
  }
  document.body.dataset.ready = '1';
});
</script>
</body>
</html>
