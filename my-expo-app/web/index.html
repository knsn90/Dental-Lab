<!DOCTYPE html>
<html lang="tr" translate="no">
  <head>
    <meta charset="utf-8" />
    <!-- Chrome/Android otomatik Google Translate'i kapat (uygulama Türkçe + kendi i18n'i var) -->
    <meta name="google" content="notranslate" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Dental Lab</title>

    <!-- ── PWA Manifest ──────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)" />

    <!-- ── iOS (Apple PWA capable) ──────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dental Lab" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- ── Android / general ─────────────────────────────────────────── -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Dental Lab" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <!-- ── Safe area CSS (üst notch + alt home indicator) ───────────── -->
    <style>
      html { background-color: var(--app-bg, #FFFFFF); }
      body {
        /* iOS standalone PWA — status bar transparent olunca safe-area body'den okunabilir */
        padding-top:    env(safe-area-inset-top, 0px);
        padding-right:  env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left:   env(safe-area-inset-left, 0px);
        background-color: var(--app-bg, #FFFFFF);
      }
      /* Standalone mode (PWA olarak açıldı) → body padding'i react-native-safe-area-context ile çakışmasın */
      @media all and (display-mode: standalone) {
        body {
          /* SafeAreaProvider tüm padding'i handle eder; body'de sadece bg tutmak yeterli */
          padding: 0;
        }
        body::before {
          /* Status bar arkası için renkli şerit — SafeAreaView edges=top kullanmayan yerlerde fallback */
          content: '';
          position: fixed;
          top: 0; left: 0; right: 0;
          height: env(safe-area-inset-top, 0px);
          background-color: var(--app-bg, #FFFFFF);
          z-index: 9999;
          pointer-events: none;
        }
      }
    </style>
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>

    <!-- ── Google Fonts preconnect ──────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── Outfit (metin fontu) ──────────────────────────────────────── -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- ── MaterialCommunityIcons (ikon fontu — expo-font tarafından da yüklenir) -->
    <style>
      @font-face {
        font-family: 'Material Design Icons';
        src: url('https://cdn.jsdelivr.net/npm/@expo/vector-icons@14.0.4/build/vendor/react-native-vector-icons/Fonts/MaterialCommunityIcons.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
    </style>

    <!-- ── Temel tipografi ────────────────────────────────────────────── -->
    <style>
      /* Outfit: HTML metin elementleri + RN <Text> → <div dir="auto"> */
      html, body,
      input, textarea, select, button, label, a {
        font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      }
      /* !important KULLANMA — ikon fontlarının inline fontFamily'si ezerek çalışır */
      [dir="auto"]:not([aria-hidden="true"]):not([role="img"]) {
        font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      }
    </style>

    <!-- ── Peyda (Farsça) ─────────────────────────────────────────────
         Mevcut aile adlarına (Outfit + inline'da geçen Inter Tight/Inter)
         unicode-range ile bağlanır: yalnız Arapça/Farsça glifler Peyda'dan
         gelir; Latin metin (Outfit) ve ağırlıklar (400/500/600/700) korunur.
         RN <Text> zaten [dir="auto"] → 'Outfit' aldığı için TÜM Farsça metin
         otomatik Peyda kullanır (inline fontFamily gerekmez). -->
    <style>
      @font-face { font-family: 'Outfit';      font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/peyda-regular.woff2')  format('woff2'); unicode-range: U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200D; }
      @font-face { font-family: 'Outfit';      font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/peyda-medium.woff2')   format('woff2'); unicode-range: U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200D; }
      @font-face { font-family: 'Outfit';      font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/peyda-semibold.woff2') format('woff2'); unicode-range: U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200D; }
      @font-face { font-family: 'Outfit';      font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/peyda-bold.woff2')     format('woff2'); unicode-range: U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200D; }
      @font-face { font-family: 'Inter Tight'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/peyda-regular.woff2')  format('woff2'); unicode-range: U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200D; }
      @font-face { font-family: 'Inter Tight'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/peyda-medium.woff2')   format('woff2'); unicode-range: U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200D; }
      @font-face { font-family: 'Inter Tight'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/peyda-semibold.woff2') format('woff2'); unicode-range: U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200D; }
      @font-face { font-family: 'Inter Tight'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/peyda-bold.woff2')     format('woff2'); unicode-range: U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200D; }
      @font-face { font-family: 'Inter';       font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/peyda-regular.woff2')  format('woff2'); unicode-range: U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200D; }
      @font-face { font-family: 'Inter';       font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/peyda-semibold.woff2') format('woff2'); unicode-range: U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200D; }
      @font-face { font-family: 'Inter';       font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/peyda-bold.woff2')     format('woff2'); unicode-range: U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200D; }
    </style>

    %%EXPO_HEAD%%
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    %%EXPO_BUNDLE%%
  </body>
</html>
